server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La config de runtime no debe cachearse (cambia por entorno)
    location = /env.js {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # Cache larga para assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
