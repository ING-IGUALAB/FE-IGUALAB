# No revelar la versión de nginx en cabeceras ni páginas de error.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Origen del backend para la CSP (connect-src). Lo genera docker-entrypoint.sh desde VITE_API_URL.
    include /etc/nginx/igualab-api.conf;

    # Ojo: un add_header dentro de un location anula los del nivel superior, por eso
    # cada location incluye las cabeceras de seguridad.

    # Sitio estático: solo lectura. Cualquier otro método (TRACE, OPTIONS, PUT…) responde 405.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Páginas de error propias y genéricas: las de nginx revelan el producto («nginx»).
    error_page 400 403 404 405 413 414 500 502 503 504 /error.html;
    location = /error.html {
        internal;
        include /etc/nginx/igualab-seguridad.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }

    # SPA: cualquier ruta desconocida cae en index.html (react-router)
    location / {
        include /etc/nginx/igualab-seguridad.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }

    # La página HTML lleva la CSP con un nonce nuevo en cada petición: nginx reemplaza el
    # marcador que deja Vite en los <script>/<link> por $request_id (aleatorio, 128 bits).
    # Hashes de style-src (sin 'unsafe-inline'): el <style> fijo que inyecta sonner (toasts) y el
    # <style> vacío que crea react-spinners antes de añadir su animación por CSSOM.
    location = /index.html {
        include /etc/nginx/igualab-seguridad.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'nonce-$request_id' 'strict-dynamic'; style-src 'self' 'sha256-Od9mHMH7x2G6QuoV3hsPkDCwIyqbg2DX3F5nLeCYQBc=' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' $igualab_api; frame-src blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        sub_filter_once off;
        sub_filter "CSP_NONCE_IGUALAB" "$request_id";
    }

    # La config de runtime no debe cachearse (cambia por entorno)
    location = /env.js {
        include /etc/nginx/igualab-seguridad.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        expires -1;
    }

    # Cache larga para assets con hash
    location /assets/ {
        include /etc/nginx/igualab-seguridad.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        # Solo archivos existentes: sin listado de carpeta (403) ni caída al index.html (200).
        try_files $uri =404;
    }
}
