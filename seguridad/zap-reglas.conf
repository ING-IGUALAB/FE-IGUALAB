# Reglas de OWASP ZAP para el stage «OWASP ZAP - Frontend» (zap-full-scan.py -c).
# Formato: id<TAB>NIVEL<TAB>(nombre)<TAB>motivo. Las reglas que no figuran quedan en WARN.
#
# Única excepción: la 40025 (Proxy Disclosure). La provoca el proxy Caddy del servidor (ingsoftware.lat),
# que responde por sí mismo a TRACE/OPTIONS/TRACK antes de llegar al frontend. El encargado del servidor
# indicó hacer bypass exclusivamente de esta regla.
40025	IGNORE	(Proxy Disclosure)	Bypass indicado por el encargado del servidor: lo provoca el proxy Caddy de ingsoftware.lat, no el frontend.
