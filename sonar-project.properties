sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=node_modules/**,dist/**,**/*.config.js,**/*.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# La cobertura se mide sobre la lógica de negocio (lib, data/seed, api/client).
# La capa de UI (pages/components/contextos/boilerplate) se excluye de la métrica
# de cobertura porque no se prueba con tests unitarios.
sonar.coverage.exclusions=src/pages/**,src/components/**,src/auth/**,src/data/DomainContext.tsx,src/api/auth.ts,src/api/usuarios.ts,src/config.ts,src/main.tsx,src/App.tsx,src/types.ts,src/vite-env.d.ts
