# Deploy UAT del frontend (Jenkins, rama uat).
# Sin puertos expuestos, un solo servicio, salida a proxy_net (external).
name: igualab-frontend-uat
services:
  frontend:
    build: .
    # Nombre fijo: Jenkins la construye, Trivy la escanea y el despliegue usa esta misma imagen.
    image: igualab-frontend-uat:latest
    container_name: igualab-frontend-uat
    env_file:
      - .env
    networks:
      - proxy_net
    restart: unless-stopped

networks:
  proxy_net:
    external: true
